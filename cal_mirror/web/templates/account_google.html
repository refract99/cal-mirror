<h2>Sign in with Google</h2>
{% if google_link %}
<p>Linked Google account: {{ google_link.email }}</p>
<form method="post" action="/account/google/unlink">
  <button type="submit">Unlink Google</button>
</form>
{% else %}
<p>Google account: not linked</p>
{% endif %}
<form method="post" action="/account/google/link">
  <button type="submit">{% if google_link %}Link another Google account{% else %}Link Google{% endif %}</button>
</form>
<p>Add this redirect URI to your Google OAuth client: <span>{{ signin_redirect }}</span></p>
