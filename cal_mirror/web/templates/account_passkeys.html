<h2>Passkeys</h2>
{% if passkeys %}
<ul>
  {% for p in passkeys %}<li>
    {{ p.name }} {% if p.created %}<small>{{ p.created.strftime("%Y-%m-%d") }}</small>{% endif %}
    <form method="post" action="/account/passkeys/delete">
      <input type="hidden" name="credential_id" value="{{ p.credential_id }}">
      <button type="submit">Delete</button>
    </form>
  </li>
  {% endfor %}
</ul>
{% else %}
<p>No passkeys yet.</p>
{% endif %}
<form method="post" action="/account/passkeys" data-passkey="create">
  <label>Name <input type="text" name="name" maxlength="80" placeholder="Laptop"></label>
  <input type="hidden" name="credential">
  <button type="submit">Add a passkey</button>
</form>
<p data-passkey-error hidden></p>
<script src="/static/passkey.js"></script>
