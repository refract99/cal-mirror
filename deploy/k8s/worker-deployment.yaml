apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal-mirror-worker
  labels:
    app.kubernetes.io/name: cal-mirror
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cal-mirror
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cal-mirror
        app.kubernetes.io/component: worker
    spec:
      nodeSelector:
        kubernetes.io/hostname: your-node-name
      containers:
        - name: worker
          image: cal-mirror-worker
          env:
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: cal-mirror-settings
                  key: PG_HOST
            - name: PG_DB
              valueFrom:
                configMapKeyRef:
                  name: cal-mirror-settings
                  key: PG_DB
            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: cal-mirror-settings
                  key: PG_USER
            - name: CAL_MIRROR_DSN
              value: host=$(PG_HOST) port=5432 dbname=$(PG_DB) user=$(PG_USER)
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-mirror-secrets
                  key: pg-password
            - name: CAL_MIRROR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cal-mirror-secrets
                  key: secret-key
            - name: CAL_MIRROR_GOOGLE_CLIENT
              value: /secrets/google/google-client.json
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: archive
              mountPath: /archive
            - name: google-client
              mountPath: /secrets/google
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: archive
          hostPath:
            path: /var/lib/cal-mirror/archive
            type: Directory
        - name: google-client
          secret:
            secretName: cal-mirror-secrets
            items:
              - key: google-client.json
                path: google-client.json
        - name: tmp
          emptyDir: {}
