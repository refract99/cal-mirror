apiVersion: apps/v1
kind: Deployment
metadata:
  name: cal-mirror-web
  labels:
    app.kubernetes.io/name: cal-mirror
    app.kubernetes.io/component: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: cal-mirror
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cal-mirror
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: cal-mirror-web
          ports:
            - containerPort: 8443
          readinessProbe:
            tcpSocket:
              port: 8443
          livenessProbe:
            tcpSocket:
              port: 8443
          env:
            - name: PG_HOST
              valueFrom:
                configMapKeyRef:
                  name: cal-mirror-settings
                  key: PG_HOST
            - name: PG_DB
              valueFrom:
                configMapKeyRef:
                  name: cal-mirror-settings
                  key: PG_DB
            - name: PG_USER
              valueFrom:
                configMapKeyRef:
                  name: cal-mirror-settings
                  key: PG_USER
            - name: CAL_MIRROR_DSN
              value: host=$(PG_HOST) port=5432 dbname=$(PG_DB) user=$(PG_USER)
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: cal-mirror-secrets
                  key: pg-password
            - name: CAL_MIRROR_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: cal-mirror-secrets
                  key: secret-key
            - name: CAL_MIRROR_OAUTH_REDIRECT
              valueFrom:
                configMapKeyRef:
                  name: cal-mirror-settings
                  key: OAUTH_REDIRECT
            - name: CAL_MIRROR_PORT
              value: "8443"
            - name: CAL_MIRROR_TLS_CERT
              value: /tls/tls.crt
            - name: CAL_MIRROR_TLS_KEY
              value: /tls/tls.key
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /tls
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: tls
          secret:
            secretName: cal-mirror-tls
