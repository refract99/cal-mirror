name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [web, worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: version
        run: echo "v=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: Stamp the version into the image
        run: |
          echo "__version__ = \"${{ steps.version.outputs.v }}\"" > cal_mirror/__init__.py
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.v }}"/' pyproject.toml
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cal-mirror-${{ matrix.image }}:${{ steps.version.outputs.v }}
            ghcr.io/${{ github.repository_owner }}/cal-mirror-${{ matrix.image }}:latest
