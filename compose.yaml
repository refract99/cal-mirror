# Quickstart: web app, worker and Postgres on one machine with Docker Compose.
# Setup: sh deploy/compose/init.sh, then docker compose up -d --build. See docs/quickstart.md.
name: cal-mirror

x-app-env: &app-env
  CAL_MIRROR_DSN: host=db dbname=cal_mirror user=cal_mirror
  PGPASSWORD: ${PG_PASSWORD:?run deploy/compose/init.sh first}
  CAL_MIRROR_SECRET_KEY: ${CAL_MIRROR_SECRET_KEY:?run deploy/compose/init.sh first}

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cal_mirror
      POSTGRES_DB: cal_mirror
      POSTGRES_PASSWORD: ${PG_PASSWORD:?run deploy/compose/init.sh first}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cal_mirror -d cal_mirror"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: makes a self-signed certificate (kept in the certs volume) and gives the
  # app user (uid 10001) the certs and archive folders.
  setup:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: cal-mirror-web:local
    user: "0"
    environment:
      HOST_NAME: ${HOST_NAME:-localhost}
    command: ["python", "/compose/make_cert.py"]
    volumes:
      - ./deploy/compose/make_cert.py:/compose/make_cert.py:ro
      - certs:/certs
      - ${ARCHIVE_DIR:-./archive}:/archive

  web:
    image: cal-mirror-web:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    environment:
      <<: *app-env
      CAL_MIRROR_OAUTH_REDIRECT: https://${HOST_NAME:-localhost}:${WEB_PORT:-8443}/google/callback
      CAL_MIRROR_PORT: "8443"
      CAL_MIRROR_BIND: 0.0.0.0
      CAL_MIRROR_TLS_CERT: /certs/tls.crt
      CAL_MIRROR_TLS_KEY: /certs/tls.key
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8443}:8443"
    volumes:
      - certs:/certs:ro

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    image: cal-mirror-worker:local
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      setup:
        condition: service_completed_successfully
    environment: *app-env
    volumes:
      - ${ARCHIVE_DIR:-./archive}:/archive

volumes:
  pgdata:
  certs:
